[project]
name = "axitime"
version = "0.1.0"
description = "Command-line host for libaxitl: check, list-pens, render and plot .axitl timelines"
requires-python = ">=3.12"
dependencies = ["libaxitl"]

[project.optional-dependencies]
# The AxiDraw Python API (pyaxidraw), from Evil Mad Scientist; only needed to drive a real plotter.
axidraw = ["axicli @ https://cdn.evilmadscientist.com/dl/ad/public/AxiDraw_API.zip", "axidrawinternal"]

[project.scripts]
axitime = "axitime.cli:main"

[tool.uv.sources]
libaxitl = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
