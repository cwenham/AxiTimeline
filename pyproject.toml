[project]
name = "axitimeline"
version = "0.1.0"
description = "Workspace root for libaxitl and axitime (pen-plotter timelines on rolls of paper)"
requires-python = ">=3.12"
dependencies = ["libaxitl", "axitime"]

[project.optional-dependencies]
axidraw = ["axitime[axidraw]"]  # uv sync --extra axidraw: what a real plot needs

[tool.uv]
package = false
# The AxiDraw API's setup.py names axidrawinternal by a temporary path; use the vendored copy instead
# (vendor/README.md).
override-dependencies = ["axidrawinternal"]

[tool.uv.workspace]
members = ["libaxitl", "axitime"]

[tool.uv.sources]
libaxitl = { workspace = true }
axitime = { workspace = true }
axidrawinternal = { path = "vendor/axidrawinternal-3.9.6-py2.py3-none-any.whl" }

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["libaxitl/tests", "axitime/tests", "editors/vscode/test"]
# Default (prepend) import mode: test file names must be unique across both packages. Don't switch to
# importlib mode: it registers the libaxitl/ workspace directory as a module and shadows the real package.
